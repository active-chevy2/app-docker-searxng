services:
  searxng:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME:-SearXNG}
      - BASE_URL=${BASE_URL:-${SERVICE_URL_SEARXNG_8080:-http://localhost:8080}}
      - SEARXNG_URL=${SEARXNG_URL:-${SERVICE_URL_SEARXNG_8080:-http://localhost:8080}}
      - SEARXNG_BIND_ADDRESS=${SEARXNG_BIND_ADDRESS:-0.0.0.0}
      - SEARXNG_SECRET=${SEARXNG_SECRET:-${SERVICE_PASSWORD_SEARXNGSECRET}}
      - SEARXNG_REDIS_URL=redis://redis:6379/0
    healthcheck:
      test:
        - CMD
        - wget
        - "-q"
        - "--spider"
        - "--header=X-Forwarded-For: 127.0.0.1"
        - "http://127.0.0.1:8080/healthz"
      interval: 5s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
